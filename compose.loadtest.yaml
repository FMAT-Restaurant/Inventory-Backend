# Overlay de pruebas de carga.
#
# Uso:
#   docker compose -f compose.yaml -f compose.loadtest.yaml up -d --build --wait
#   docker compose -f compose.yaml -f compose.loadtest.yaml --profile loadtest run --rm k6 run /scripts/api/smoke.js
#
# El perfil `loadtest` evita que k6 arranque junto con el stack de desarrollo.
services:
  app:
    environment:
      # Las pruebas de carga son de desarrollo/qa: habilitan /apo/test/reset.
      NODE_ENV: development
      RABBITMQ_URL: "amqp://${RABBITMQ_USER:-admin}:${RABBITMQ_PASSWORD:-supersecurepassword}@rabbitmq:5672"
    depends_on:
      rabbitmq:
        condition: service_healthy

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-admin}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-supersecurepassword}
    ports:
      - '${RABBITMQ_HOST_PORT:-5672}:5672'
      - '${RABBITMQ_MANAGEMENT_HOST_PORT:-15672}:15672'
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - inventory-network
    healthcheck:
      test: ['CMD', 'rabbitmq-diagnostics', '-q', 'ping']
      interval: 5s
      timeout: 10s
      retries: 12
      start_period: 20s

  k6:
    build:
      context: .
      dockerfile: tests/k6/Dockerfile
    profiles: ['loadtest']
    environment:
      K6_BASE_URL: http://app:8083
      K6_RABBITMQ_URL: "amqp://${RABBITMQ_USER:-admin}:${RABBITMQ_PASSWORD:-supersecurepassword}@rabbitmq:5672"
      K6_RESET_DB: ${K6_RESET_DB:-false}
      K6_AUTH_TOKEN: ${K6_AUTH_TOKEN:-}
      K6_POLL_TIMEOUT_MS: ${K6_POLL_TIMEOUT_MS:-10000}
      K6_POLL_INTERVAL_MS: ${K6_POLL_INTERVAL_MS:-250}
      K6_HTTP_P95_MS: ${K6_HTTP_P95_MS:-500}
      K6_HTTP_P99_MS: ${K6_HTTP_P99_MS:-1000}
      K6_MAX_ERROR_RATE: ${K6_MAX_ERROR_RATE:-0.01}
      K6_EVENT_P95_MS: ${K6_EVENT_P95_MS:-2000}
    volumes:
      - ./tests/k6/out:/scripts/out
    depends_on:
      app:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - inventory-network
    command: ['run', '/scripts/api/smoke.js']

volumes:
  rabbitmq_data:
